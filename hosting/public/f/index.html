<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Einladung zu Mica</title>
    <meta name="description" content="Jemand möchte sich bei Mica mit dir verbinden." />
    <meta property="og:title" content="Einladung zu Mica" />
    <meta property="og:description" content="Jemand möchte sich bei Mica mit dir verbinden." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0B1017" />
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #0b1017;
        --surface: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f4f5f7;
        --muted: rgba(244, 245, 247, 0.6);
        --green: #35ba84;
        --amber: #e9a02b;
        --blue: #4772f8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--ink);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* Three very slow fields in the mark's own colours — the web echo of the
         app's aurora backdrop. Radial gradients, never a blur. */
      body::before {
        content: '';
        position: fixed;
        inset: -20%;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(38% 32% at 22% 18%, rgba(53, 186, 132, 0.18), transparent 70%),
          radial-gradient(42% 34% at 82% 26%, rgba(233, 160, 43, 0.14), transparent 70%),
          radial-gradient(46% 40% at 50% 88%, rgba(71, 114, 248, 0.2), transparent 70%);
      }
      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .mark {
        width: 132px;
        height: auto;
        margin: 0 auto 32px;
        display: block;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .handle {
        display: inline-block;
        margin: 0 0 20px;
        padding: 7px 16px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 15px;
        font-weight: 600;
      }
      p {
        margin: 0 0 28px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      a.btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 20px;
        border-radius: 18px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      a.btn:active {
        opacity: 0.85;
      }
      a.primary {
        background: #ffffff;
        color: var(--ink);
      }
      a.secondary {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .soon {
        min-height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        border: 1px dashed var(--border);
        color: var(--muted);
        font-size: 14px;
      }
      footer {
        margin-top: 32px;
        font-size: 12px;
        color: rgba(244, 245, 247, 0.38);
      }
      footer a {
        color: inherit;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

      </svg>

      <h1 id="headline">Einladung zu Mica</h1>
      <div class="handle" id="handle" hidden></div>
      <p id="lead">
        Mica zeigt dir, wer aus deinem Freundeskreis gerade Zeit hat — ohne Feed, ohne Fremde.
      </p>

      <div class="actions">
        <a class="btn secondary" id="open-app" href="#" hidden>In der App öffnen</a>
        <a class="btn primary" id="store" href="#" hidden></a>
        <div class="soon" id="store-soon" hidden>App Store und Play Store folgen in Kürze</div>
      </div>

      <footer>
        <a href="https://micamap.de/datenschutz">Datenschutz</a> ·
        <a href="https://micamap.de/impressum">Impressum</a>
      </footer>
    </main>

    <script>
      (function () {
        // Store listings do not exist until the app is submitted. Filling these
        // two in is the whole switch from the "coming soon" state to real buttons.
        var APP_STORE_URL = '';
        var PLAY_STORE_URL = '';

        // Mirrors claimUsername's server-side rule in functions/index.js. Anything
        // else is treated as "no username" rather than echoed back into the page.
        var USERNAME_RE = /^[a-z0-9][a-z0-9._-]{1,29}$/;

        var raw = decodeURIComponent(location.pathname.replace(/^\/f\/?/, '')).trim();
        var username = USERNAME_RE.test(raw) ? raw : null;

        if (username) {
          document.getElementById('headline').textContent = 'Du wurdest zu Mica eingeladen';
          var handle = document.getElementById('handle');
          handle.textContent = '@' + username;
          handle.hidden = false;
          document.getElementById('lead').textContent =
            'Installiere Mica, melde dich an — dann geht die Anfrage an @' +
            username +
            ' automatisch raus.';

          // Universal Links do not fire when a link is pasted into the address bar
          // or opened from an in-app browser. Anyone who already has the app and
          // still ended up here needs a way in that does not depend on them.
          var openApp = document.getElementById('open-app');
          openApp.href = 'mica://f/' + username;
          openApp.hidden = false;
        }

        var ua = navigator.userAgent || '';
        var isIOS =
          /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
        var isAndroid = /Android/.test(ua);
        var storeUrl = isIOS ? APP_STORE_URL : isAndroid ? PLAY_STORE_URL : '';

        if (storeUrl) {
          var store = document.getElementById('store');
          store.href = storeUrl;
          store.textContent = isIOS ? 'Im App Store laden' : 'Bei Google Play laden';
          store.hidden = false;
        } else {
          document.getElementById('store-soon').hidden = false;
        }
      })();
    </script>
  </body>
</html>
