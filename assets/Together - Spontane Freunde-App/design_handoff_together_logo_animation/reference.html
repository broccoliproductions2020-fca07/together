<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Together — Logo & Morph-Animation (Referenz)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ECEAE4; font-family: 'Schibsted Grotesk', sans-serif; padding: 48px; color: #14161A; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  p.sub { font-size: 13px; color: #6b6e76; margin: 0 0 32px; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
  .card { background: #0E1116; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #6b6e76; }

  /* ---- Static app icon (circles at rest) ---- */
  .icon-square { width: 104px; height: 104px; border-radius: 24px; background: #0E1116; display: flex; align-items: center; justify-content: center; }

  /* ---- Wordmark animation (loop) ---- */
  @keyframes tgD-left  { 0%,22%{opacity:0;transform:translateX(12px)} 36%,80%{opacity:1;transform:translateX(0)} 90%,100%{opacity:0} }
  @keyframes tgD-right { 0%,22%{opacity:0;transform:translateX(-12px)} 36%,80%{opacity:1;transform:translateX(0)} 90%,100%{opacity:0} }
  @keyframes tgE-orb1 { 0%,3%{opacity:0;transform:rotate(-310deg) translate(20px,0) scale(.04)} 8%{opacity:1} 30%{transform:rotate(-98deg) translate(20px,0) scale(1.1)} 40%,80%{opacity:.92;transform:rotate(-90deg) translate(20px,0) scale(1)} 90%,100%{opacity:0} }
  @keyframes tgE-orb2 { 0%,3%{opacity:0;transform:rotate(-190deg) translate(20px,0) scale(.04)} 8%{opacity:1} 30%{transform:rotate(22deg) translate(20px,0) scale(1.1)} 40%,80%{opacity:.92;transform:rotate(30deg) translate(20px,0) scale(1)} 90%,100%{opacity:0} }
  @keyframes tgE-orb3 { 0%,3%{opacity:0;transform:rotate(-70deg) translate(20px,0) scale(.04)} 8%{opacity:1} 30%{transform:rotate(142deg) translate(20px,0) scale(1.1)} 40%,80%{opacity:.92;transform:rotate(150deg) translate(20px,0) scale(1)} 90%,100%{opacity:0} }
  @keyframes tgP-dot { 0%,36%{opacity:0;transform:translateY(-42px) rotate(-30deg) scale(.4)} 42%{opacity:1} 46%{transform:translateY(7px) rotate(8deg) scale(1.15)} 50%{transform:translateY(-3px) rotate(-3deg) scale(.95)} 54%,80%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)} 90%,100%{opacity:0} }

  .wordmark { display: flex; align-items: center; justify-content: center; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 600; font-size: 58px; letter-spacing: -0.03em; color: #F4F5F7; }
  .o-slot { position: relative; display: inline-block; width: 54px; height: 54px; margin: 0 3px; }
  .t-left { animation: tgD-left 6s infinite both; }
  .t-right { animation: tgD-right 6s infinite both; }
  .dot { display: inline-block; color: #F4F5F7; animation: tgP-dot 6s infinite both; transform-origin: center; }
</style>
<template id="__bundler_thumbnail"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="#0E1116"/><circle cx="50" cy="36" r="14" fill="#6E8BF7"/><circle cx="62" cy="58" r="14" fill="#E0A23E"/><circle cx="38" cy="58" r="14" fill="#41C08D"/></svg></template>
</head>
<body>

  <h1>Together — Icon &amp; Morph-o-Animation</h1>
  <p class="sub">Design-Referenz für die Umsetzung in React Native. Nicht direkt übernehmen — siehe README.md.</p>

  <div class="row">
    <div class="card">
      <div class="label">App-Icon (statisch, Ruhezustand)</div>
      <div class="icon-square">
        <svg viewBox="0 0 110 110" width="52" height="52">
          <g transform="translate(55 55)">
            <circle cx="0" cy="0" r="30" fill="#6E8BF7" transform="rotate(-90) translate(20,0)" style="mix-blend-mode:screen;"/>
            <circle cx="0" cy="0" r="30" fill="#E0A23E" transform="rotate(30) translate(20,0)" style="mix-blend-mode:screen;"/>
            <circle cx="0" cy="0" r="30" fill="#41C08D" transform="rotate(150) translate(20,0)" style="mix-blend-mode:screen;"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="card" style="min-width:320px;">
      <div class="label">Wordmark-Animation (Loop, 6s)</div>
      <div class="wordmark">
        <span class="t-left">t</span>
        <span class="o-slot">
          <svg viewBox="0 0 110 110" width="54" height="54" style="display:block;overflow:visible;">
            <g transform="translate(55 55)">
              <circle cx="0" cy="0" r="30" fill="#6E8BF7" style="mix-blend-mode:screen;transform-box:fill-box;transform-origin:center;animation:tgE-orb1 6s infinite both;"/>
              <circle cx="0" cy="0" r="30" fill="#E0A23E" style="mix-blend-mode:screen;transform-box:fill-box;transform-origin:center;animation:tgE-orb2 6s infinite both;"/>
              <circle cx="0" cy="0" r="30" fill="#41C08D" style="mix-blend-mode:screen;transform-box:fill-box;transform-origin:center;animation:tgE-orb3 6s infinite both;"/>
            </g>
          </svg>
        </span>
        <span class="t-right">gether</span><span class="dot">.</span>
      </div>
    </div>
  </div>

  <div class="row" style="background:#fff;border-radius:16px;padding:24px 28px;border:1px solid #e3e1da;">
    <div>
      <div class="label" style="margin-bottom:12px;">Farbtokens</div>
      <div style="display:flex;gap:20px;">
        <div><div style="width:64px;height:32px;border-radius:8px;background:#0E1116;"></div><div style="font-size:11px;margin-top:6px;">Ink · #0E1116</div></div>
        <div><div style="width:64px;height:32px;border-radius:8px;background:#F4F5F7;border:1px solid #e3e1da;"></div><div style="font-size:11px;margin-top:6px;">Paper · #F4F5F7</div></div>
        <div><div style="width:64px;height:32px;border-radius:8px;background:#6E8BF7;"></div><div style="font-size:11px;margin-top:6px;">Open · #6E8BF7</div></div>
        <div><div style="width:64px;height:32px;border-radius:8px;background:#E0A23E;"></div><div style="font-size:11px;margin-top:6px;">Soon · #E0A23E</div></div>
        <div><div style="width:64px;height:32px;border-radius:8px;background:#41C08D;"></div><div style="font-size:11px;margin-top:6px;">Now · #41C08D</div></div>
      </div>
    </div>
  </div>

</body>
</html>
