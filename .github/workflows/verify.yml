name: Verify

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check:node
      - run: npm run typecheck
      - run: npm run lint:src
      - run: npm run test:firestore-rules
      - run: npm run test:storage-rules
      - run: npm run test:journey-rtdb
      - run: npm run test:activity-backfill
      - run: npm run test:functions
      - run: npm run test:email-verification-gate
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix functions --omit=dev --audit-level=high
